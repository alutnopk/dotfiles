# TODO: steal config from https://rushter.com/blog/helix-editor/
theme = "adwaita-dark"

[editor]
# gutters = ["diagnostics", "line-numbers"]
line-number = "relative"
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.soft-wrap]
enable = true

[keys.normal]
C-c = ["keep_primary_selection", "collapse_selection"]
C-j = "half_page_down"
C-k = "half_page_up"
0 = "goto_line_start"
"$" = "goto_line_end"
"^" = "goto_first_nonwhitespace"
G = "goto_file_end"

[keys.insert]
C-c = "normal_mode"

[keys.select]
C-c = "normal_mode"
0 = "goto_line_start"
"$" = "goto_line_end"
"^" = "goto_first_nonwhitespace"
G = "goto_file_end"
